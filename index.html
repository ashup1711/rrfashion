    <style>
      /* Inline styles for initial loading state before React hydrates */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #fafaf9;
      }
      .app-loading__spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #9A8573;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script type="module" crossorigin src="/rrfashion/assets/index-Bop4hvsl.js"></script>
    <link rel="stylesheet" crossorigin href="/rrfashion/assets/index-BFsdrdJ_.css">
  <link rel="manifest" href="/rrfashion/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/rrfashion/registerSW.js"></script></head>
  <body>
    <div id="root">
      <!-- Loading state shown before React hydrates -->
      <div class="app-loading">
        <div class="app-loading__spinner" role="status" aria-label="Loading">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
    </div>
    <!-- Load runtime-env.js before app bundle (path matches Vite base /rrfashion/) -->
    <script src="/rrfashion/runtime-env.js"></script>
  </body>
</html>
