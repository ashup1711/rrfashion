name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ashup1711/rrfashion
  KUBE_NAMESPACE: rrfashion

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=${{ env.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy infrastructure
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/minio.yaml

      - name: Wait for infrastructure
        run: |
          kubectl rollout status deployment/postgres --namespace=${{ env.KUBE_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/redis --namespace=${{ env.KUBE_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/minio --namespace=${{ env.KUBE_NAMESPACE }} --timeout=120s

      - name: Deploy application
        run: |
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/rrfashion-api \
            rrfashion-api=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --namespace=${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/rrfashion-api --namespace=${{ env.KUBE_NAMESPACE }} --timeout=300s

      - name: Apply ingress and cronjob
        run: |
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/cronjob.yaml

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
          kubectl get services -n ${{ env.KUBE_NAMESPACE }}