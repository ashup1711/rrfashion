name: Deploy Frontend to GitHub Pages (with Live Backend + ngrok)

on:
  workflow_dispatch:
  push:
    branches: [main]

# Allow one deployment per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Start backend k8s/minikube stack + ngrok tunnel on Mac Mini
  # NOTE: The backend is served EXCLUSIVELY through the minikube
  # (Kubernetes) deployment. docker-compose is NOT used as the serving
  # path anymore — this job builds the image into the minikube daemon,
  # applies the k8s manifests, and keeps kubectl port-forward alive via
  # a launchd agent so that localhost:3000 reaches the pod.
  # ──────────────────────────────────────────────────────────────
  backend-ngrok:
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      ngrok_api_url: ${{ steps.capture-ngrok-url.outputs.api_url }}
      url_status: ${{ steps.capture-ngrok-url.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Minikube / k8s Lifecycle ────────────────────────────
      - name: Ensure Docker is running
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon not running — starting Docker Desktop..."
            open -a Docker
            echo "Waiting for Docker daemon..."
            for i in $(seq 1 30); do
              if docker info >/dev/null 2>&1; then
                echo "Docker ready after ${i}s"
                exit 0
              fi
              sleep 2
            done
            echo "Docker failed to start within 60s"
            exit 1
          fi
          echo "Docker is already running"

      - name: Ensure minikube is running
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          if minikube status >/dev/null 2>&1; then
            echo "minikube is already running"
            minikube status
          else
            echo "Starting minikube..."
            minikube start --driver=docker --memory=4096 --cpus=4
            echo "minikube started"
          fi
          minikube update-context
          kubectl config use-context minikube
          kubectl get nodes

      - name: Build backend image into minikube
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "Building rrfashion:local into the minikube daemon..."
          minikube image build -t rrfashion:local ./backend
          echo "Image build complete."
          minikube image ls | grep rrfashion || true

      - name: Apply k8s manifests
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "=== Applying k8s manifests (idempotent) ==="
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/minio.yaml
          kubectl apply -f k8s/deployment-minikube.yaml
          echo "=== Manifests applied ==="

      - name: Rollout restart and wait for API deployment
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "Restarting deployment to pick up the new image..."
          kubectl rollout restart deployment/rrfashion-api -n rrfashion || true
          kubectl rollout status deployment/rrfashion-api -n rrfashion --timeout=300s
          echo "=== Pods ==="
          kubectl get pods -n rrfashion

      # ── Port-forward: localhost:3000 -> minikube pod ───────
      # The API is reached ONLY via the k8s service. GitHub Actions
      # kills step-spawned background processes at job end, so the
      # port-forward runs as a launchd agent (same pattern as ngrok's
      # com.ngrok.tunnel) and stays alive after the job completes.
      - name: Ensure kubectl port-forward via launchd
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          PLIST="$HOME/Library/LaunchAgents/com.rrfashion.portforward.plist"

          # Stop the current port-forward so the service can bind :3000
          pkill -f "kubectl port-forward" || true

          cat > "$PLIST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.rrfashion.portforward</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/opt/homebrew/bin/kubectl</string>
                  <string>port-forward</string>
                  <string>-n</string>
                  <string>rrfashion</string>
                  <string>deployment/rrfashion-api</string>
                  <string>3000:3000</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <true/>
              <key>StandardOutPath</key>
              <string>/tmp/kubectl-port-forward.log</string>
              <key>StandardErrorPath</key>
              <string>/tmp/kubectl-port-forward.log</string>
              <key>EnvironmentVariables</key>
              <dict>
                  <key>PATH</key>
                  <string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin</string>
              </dict>
          </dict>
          </plist>
          EOF

          launchctl bootout gui/$(id -u) "$PLIST" 2>/dev/null || true
          launchctl bootstrap gui/$(id -u) "$PLIST"
          sleep 5
          echo "--- port-forward log ---"
          cat /tmp/kubectl-port-forward.log 2>/dev/null || echo "(no log yet)"
          if pgrep -f "kubectl port-forward" >/dev/null; then
            echo "port-forward is running (launchd com.rrfashion.portforward)"
          else
            echo "port-forward FAILED to start"
            exit 1
          fi

      # ── Backend Health Check ───────────────────────────────
      - name: Wait for backend health
        id: health-check
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          MAX_RETRIES=30
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Waiting for backend... (${i}/${MAX_RETRIES})"
            sleep 2
          done
          echo "Backend failed to become healthy within $((MAX_RETRIES * 2))s"
          echo "--- Pod status ---"
          kubectl get pods -n rrfashion || true
          echo "--- Backend logs (last 50 lines) ---"
          kubectl logs deployment/rrfashion-api -n rrfashion --tail=50 || true
          echo "--- port-forward log ---"
          tail -20 /tmp/kubectl-port-forward.log 2>/dev/null || true
          echo "healthy=false" >> $GITHUB_OUTPUT
          exit 1

      # ── ngrok — use persistent launchd service (com.ngrok.tunnel) ──
      - name: Capture ngrok public URL from persistent tunnel
        id: capture-ngrok-url
        run: |
          NGROK_BASE_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "Raw ngrok URL: $NGROK_BASE_URL"

          # Validate URL
          if [[ -z "$NGROK_BASE_URL" || ! "$NGROK_BASE_URL" =~ ^https:// ]]; then
            echo "Invalid or empty ngrok URL. Using fallback."
            echo "status=fallback" >> $GITHUB_OUTPUT
            echo "api_url=" >> $GITHUB_OUTPUT
            exit 0  # Non-fatal — deploy will use vars.FRONTEND_API_URL
          fi

          NGROK_API_URL="${NGROK_BASE_URL}/api"
          echo "Valid ngrok API URL: $NGROK_API_URL"
          echo "status=ngrok" >> $GITHUB_OUTPUT
          echo "api_url=$NGROK_API_URL" >> $GITHUB_OUTPUT

          # Also write to file for artifact sharing
          echo "$NGROK_API_URL" > ngrok-url.txt

      # ── Diagnostics (always runs, even on failure) ─────────
      - name: Print diagnostics
        if: always()
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "=== k8s Pod Status ==="
          kubectl get pods -n rrfashion || true
          echo ""
          echo "=== k8s Deployments ==="
          kubectl get deployments -n rrfashion || true
          echo ""
          echo "=== PVCs ==="
          kubectl get pvc -n rrfashion || true
          echo ""
          echo "=== port-forward (launchd) ==="
          pgrep -f "kubectl port-forward" && echo "(running)" || echo "(not running)"
          tail -10 /tmp/kubectl-port-forward.log 2>/dev/null || echo "(no port-forward log)"
          echo ""
          echo "=== ngrok Process ==="
          pgrep -f ngrok && echo "(running)" || echo "(not running)"
          echo ""
          echo "=== ngrok launchd Log (last 20 lines) ==="
          tail -20 /tmp/ngrok-launchd.log 2>/dev/null || echo "(no launchd log)"
          echo ""
          echo "=== ngrok URL (captured) ==="
          cat ngrok-url.txt 2>/dev/null || echo "(no ngrok url file)"

      # ── Upload artifact for next job ────────────────────────
      - name: Upload ngrok URL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngrok-url
          path: ngrok-url.txt
          retention-days: 1
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Build frontend + deploy to GitHub Pages on ubuntu
  # ──────────────────────────────────────────────────────────────
  deploy-frontend:
    needs: backend-ngrok
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Download ngrok URL from Job 1 ───────────────────────
      - name: Download ngrok URL artifact
        id: download-url
        uses: actions/download-artifact@v4
        with:
          name: ngrok-url
          path: ./
        continue-on-error: true  # Proceed even if artifact missing (fallback)

      # ── Resolve the API URL (fallback chain) ────────────────
      - name: Resolve API URL
        id: resolve-url
        run: |
          # Priority 1: ngrok URL from artifact (Job 1 succeeded with ngrok)
          if [ -f ngrok-url.txt ]; then
            NGROK_API_URL=$(cat ngrok-url.txt | tr -d '[:space:]')
            if [[ -n "$NGROK_API_URL" && "$NGROK_API_URL" =~ ^https:// ]]; then
              echo "Using ngrok URL: $NGROK_API_URL"
              echo "api_url=$NGROK_API_URL" >> $GITHUB_OUTPUT
              echo "source=ngrok" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Priority 2: vars.FRONTEND_API_URL (configured in GitHub repo)
          if [[ -n "${{ vars.FRONTEND_API_URL }}" ]]; then
            echo "Using vars.FRONTEND_API_URL: ${{ vars.FRONTEND_API_URL }}"
            echo "api_url=${{ vars.FRONTEND_API_URL }}" >> $GITHUB_OUTPUT
            echo "source=vars" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Priority 3: Hardcoded localhost fallback
          echo "No ngrok URL and no FRONTEND_API_URL variable. Using localhost fallback."
          echo "api_url=http://localhost:3000/api" >> $GITHUB_OUTPUT
          echo "source=fallback" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Frontend Build ──────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npx vite build
        env:
          VITE_API_URL: ${{ steps.resolve-url.outputs.api_url }}

      # ── Runtime Env Injection ──────────────────────────────
      - name: Inject runtime API URL into dist
        working-directory: frontend
        run: |
          API_URL="${{ steps.resolve-url.outputs.api_url }}"
          echo "Injecting API URL: $API_URL"
          cat > dist/runtime-env.js << EOF
          window.__RUNTIME_ENV__ = {
            API_URL: '${API_URL}',
          };
          EOF
          echo "Runtime env injected:"
          cat dist/runtime-env.js

      # ── Deploy to GitHub Pages ─────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── Deployment Summary ─────────────────────────────────
      - name: Print deployment summary
        if: always()
        run: |
          echo "=========================================="
          echo "Deployment Complete"
          echo "=========================================="
          echo "API URL source: ${{ steps.resolve-url.outputs.source }}"
          echo "API URL: ${{ steps.resolve-url.outputs.api_url }}"
          echo "GitHub Pages: ${{ steps.deployment.outputs.page_url }}"
          echo "=========================================="
